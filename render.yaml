services:
  # Spring Boot Backend Web Service
  - type: web
    name: placetrack-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/public/health
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://placetrack-frontend.onrender.com,http://localhost:5173
      - key: EMAIL_DEVELOPMENT_MODE
        value: "true"
      - key: FRONTEND_BASE_URL
        value: https://placetrack-frontend.onrender.com

  # React Frontend Static Site
  - type: static
    name: placetrack-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: placetrack-backend
          envVarKey: RENDER_EXTERNAL_URL
          property: host
