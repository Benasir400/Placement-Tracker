server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: placetrack
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/placetrack;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:bena26875@gmail.com}
    password: ${SMTP_PASSWORD:ndcaxgglcidkabjw}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

placetrack:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-change-this}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  invitations:
    expiry-hours: ${INVITATION_EXPIRY_HOURS:72}
  email:
    development-mode: ${EMAIL_DEVELOPMENT_MODE:true}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://127.0.0.1:5173}
  ai:
    provider: ${AI_PROVIDER:none}

logging:
  level:
    org.springframework.security: INFO
